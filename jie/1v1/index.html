<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>结 · 1v1 人机对战</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1d24;
    color: #e0e0e0;
    padding: 16px;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 16px;
    color: #f0c674;
  }
  /* ★ 统一隐藏 class，替代 style.display 混用 */
  .hidden { display: none !important; }

  .status-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .player-card {
    background: #252932;
    border-radius: 8px;
    padding: 12px 16px;
    border: 2px solid transparent;
  }
  .player-card.p0 { border-color: #6ca0dc; }
  .player-card.p1 { border-color: #d97757; }
  .player-card .name {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .player-card .stats {
    display: flex;
    gap: 16px;
    font-size: 13px;
  }
  .player-card .stat-val {
    font-weight: bold;
    color: #f0c674;
  }
  .player-card.dead { opacity: 0.4; }
  .panel {
    background: #252932;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .panel-title {
    font-size: 14px;
    color: #8a9bb0;
    margin-bottom: 10px;
    border-bottom: 1px solid #333844;
    padding-bottom: 6px;
  }
  .skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }
  .skill-btn {
    background: #2d3340;
    border: 1px solid #3a4150;
    color: #e0e0e0;
    padding: 10px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.15s;
    font-family: inherit;
  }
  .skill-btn:hover:not(:disabled) {
    background: #3a4150;
    border-color: #6ca0dc;
  }
  .skill-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .skill-btn.atk { border-left: 3px solid #d97757; }
  .skill-btn.op { border-left: 3px solid #6ca0dc; }
  .skill-btn.norm { border-left: 3px solid #7fb069; }
  .skill-btn.drain { border-left: 3px solid #b58cd6; }
  .skill-btn.counter { border-left: 3px solid #f0c674; }
  .skill-btn .sid {
    font-size: 10px;
    color: #8a9bb0;
    display: block;
  }
  .skill-btn .sk-name {
    font-weight: bold;
    display: block;
    margin: 2px 0;
  }
  .skill-btn .sk-desc {
    font-size: 10px;
    color: #8a9bb0;
  }
  .input-area {
    margin-top: 12px;
    padding: 10px;
    background: #1f232c;
    border-radius: 6px;
    display: none;
  }
  .input-area.active { display: block; }
  .input-area label {
    font-size: 13px;
    margin-right: 8px;
  }
  .input-area input {
    background: #2d3340;
    border: 1px solid #3a4150;
    color: #e0e0e0;
    padding: 6px 10px;
    border-radius: 4px;
    width: 60px;
    font-family: inherit;
  }
  .btn {
    background: #4a90c2;
    border: none;
    color: white;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    margin-left: 6px;
  }
  .btn:hover { background: #5a9fd2; }
  .btn.secondary {
    background: #3a4150;
  }
  .btn.secondary:hover { background: #4a5260; }
  .log {
    background: #1f232c;
    border-radius: 6px;
    padding: 10px;
    max-height: 220px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
    font-family: "Menlo", "Consolas", monospace;
  }
  .log .round-line {
    color: #8a9bb0;
    margin-top: 8px;
    font-weight: bold;
  }
  .log .result-line { padding-left: 12px; }
  .log .hp-change { color: #d97757; }
  .view-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .view-switch button {
    flex: 1;
    background: #2d3340;
    border: 1px solid #3a4150;
    color: #8a9bb0;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .view-switch button.active {
    background: #3a4150;
    border-color: #6ca0dc;
    color: #e0e0e0;
  }
  .win-rate {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin: 8px 0;
    color: #f0c674;
  }
  .win-rate .label {
    font-size: 12px;
    color: #8a9bb0;
    font-weight: normal;
    margin-right: 8px;
  }
  .dist-row {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .dist-name {
    width: 100px;
    flex-shrink: 0;
    color: #c0c8d4;
  }
  .dist-prob {
    width: 60px;
    flex-shrink: 0;
    text-align: right;
    margin-right: 8px;
    color: #f0c674;
    font-family: monospace;
  }
  .dist-bar-bg {
    flex: 1;
    height: 14px;
    background: #1f232c;
    border-radius: 3px;
    overflow: hidden;
  }
  .dist-bar {
    height: 100%;
    background: linear-gradient(90deg, #4a90c2, #6ca0dc);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .game-over {
    text-align: center;
    padding: 24px;
    font-size: 22px;
    font-weight: bold;
  }
  .game-over.win { color: #7fb069; }
  .game-over.lose { color: #d97757; }
  .game-over.draw { color: #f0c674; }
  .reset-btn {
    display: block;
    margin: 16px auto 0;
    background: #3a4150;
    border: none;
    color: #e0e0e0;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }
  .reset-btn:hover { background: #4a5260; }
  .loading {
    text-align: center;
    padding: 40px;
    color: #8a9bb0;
  }
  .loading .step {
    margin: 6px 0;
    font-size: 14px;
  }
  .error-box {
    background: #2a1f1f;
    border: 1px solid #d97757;
    border-radius: 8px;
    padding: 20px;
    margin: 20px auto;
    max-width: 640px;
    text-align: left;
    font-size: 14px;
    line-height: 1.7;
  }
  .error-box h2 {
    color: #d97757;
    font-size: 18px;
    margin-bottom: 12px;
  }
  .error-box code {
    background: #1f232c;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: "Menlo", monospace;
    font-size: 12px;
    color: #f0c674;
    word-break: break-all;
  }
  .error-box ul {
    margin: 8px 0 0 20px;
  }
  .error-box li {
    margin-bottom: 6px;
  }
  .view-empty {
    text-align: center;
    padding: 30px;
    color: #6a7580;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>结 · 1v1 人机对战</h1>

  <!-- 加载中 -->
  <div id="loading" class="loading">
    <div id="loading-steps"></div>
  </div>

  <!-- 错误提示 -->
  <div id="error-box" class="error-box hidden"></div>

  <!-- 游戏主界面 -->
  <div id="game" class="hidden">
    <div class="status-bar">
      <div class="player-card p0" id="card-p0">
        <div class="name">P0（你）</div>
        <div class="stats">
          <span>HP <span class="stat-val" id="hp0">2.0</span></span>
          <span>点 <span class="stat-val" id="pt0">2</span></span>
          <span>免 <span class="stat-val" id="tk0">1</span></span>
        </div>
      </div>
      <div class="player-card p1" id="card-p1">
        <div class="name">P1（AI）</div>
        <div class="stats">
          <span>HP <span class="stat-val" id="hp1">2.0</span></span>
          <span>点 <span class="stat-val" id="pt1">2</span></span>
          <span>免 <span class="stat-val" id="tk1">1</span></span>
        </div>
      </div>
    </div>

    <div class="panel" id="skill-panel">
      <div class="panel-title">选择招式</div>
      <div class="skill-grid" id="skill-grid"></div>
      <div class="input-area" id="input-area">
        <span id="input-skill-name"></span>
        <label>发数：</label>
        <input type="number" id="input-n" value="1" min="1" max="20">
        <button class="btn" onclick="confirmAttack()">确认</button>
        <button class="btn secondary" onclick="cancelAttack()">取消</button>
      </div>
      <div id="game-over-box" class="hidden"></div>
    </div>

    <div class="panel">
      <div class="panel-title">AI 视角分析</div>
      <div class="view-switch">
        <button id="view-p0" class="active" onclick="setView(0)">P0 视角</button>
        <button id="view-p1" onclick="setView(1)">P1 视角</button>
        <button id="view-none" onclick="setView(-1)">不显示</button>
      </div>
      <div id="view-content">
        <div class="win-rate">
          <span class="label">近似胜率</span>
          <span id="win-rate-val">50.0%</span>
        </div>
        <div id="dist-list"></div>
      </div>
      <div id="view-empty" class="view-empty hidden">
        （当前不显示分析）
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">战斗日志</div>
      <div class="log" id="log"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">重新开始</button>
  </div>
</div>

<script>
// ==================== 技能表 ====================
const SKILLS = {
  1:  {name:"啸波", type:"ATK", cost:1, dmg:1, multi:true},
  2:  {name:"电波", type:"ATK", cost:2, dmg:1, multi:true},
  3:  {name:"致命", type:"ATK", cost:3, dmg:1.5, multi:true},
  4:  {name:"地波", type:"ATK", cost:4, dmg:2, multi:true},
  5:  {name:"片波", type:"ATK", cost:5, dmg:2.5, multi:true},
  6:  {name:"派波", type:"ATK", cost:6, dmg:3, multi:true},
  7:  {name:"气波", type:"ATK", cost:7, dmg:3.5, multi:true},
  8:  {name:"青龙波", type:"ATK", cost:8, dmg:4, multi:true},
  9:  {name:"结", type:"OP", cost:-1},
  10: {name:"反弹", type:"NORM", def_ids:[1,14], rebound:true},
  11: {name:"小防", type:"NORM", def_lo:1, def_hi:2, def_ticket:true},
  12: {name:"金龙波", type:"ATK", cost:12, dmg:6, multi:true},
  13: {name:"大防", type:"NORM", def_lo:3, def_hi:5},
  14: {name:"免单", type:"ATK", ticket:1, dmg:0.5, multi:true},
  15: {name:"吸", type:"DRAIN", def_lo:1, def_hi:5, def_ticket:true, drain:[[1,5,1]]},
  16: {name:"大吸", type:"DRAIN", cost:1, def_lo:1, def_hi:5, def_ticket:true, drain:[[1,5,2]]},
  17: {name:"拉", type:"COUNTER", pull:true},
  18: {name:"大拉", type:"COUNTER", cost:1, pull:true, big:true},
  19: {name:"摩擦", type:"DRAIN", friction:true, def_lo:1, def_hi:8, def_ticket:true, drain:[[1,5,1]]},
  20: {name:"大摩", type:"DRAIN", friction:true, big:true, def_lo:1, def_hi:99, def_ticket:true, drain:[[1,5,2],[6,8,1]]},
  21: {name:"收", type:"NORM", cost:1, def_lo:6, def_hi:7},
  22: {name:"青龙收", type:"NORM", cost:1, def_ids:[8]},
  23: {name:"金龙收", type:"NORM", cost:1, def_ids:[12]},
  24: {name:"世界末日", type:"ATK", cost:20, dmg:10, unblockable:true},
};

// 给每个技能补上 id
for (const sid in SKILLS) {
  SKILLS[sid].id = parseInt(sid);
}

const HP_MIN = 1, HP_MAX = 4, PT_MAX = 20, TK_MAX = 2;

// ==================== 游戏状态 ====================
let state = null;
let V_TABLE = null;
let PI_TABLE = null;
let currentView = 0;   // -1 = 不显示, 0 = P0 视角, 1 = P1 视角
let pendingAttack = null;
let gameOver = false;

// ==================== 辅助 ====================
function makePlayer() {
  return { hp: 2, pt: 2, tk: 1, dead: false };
}

function singleCost(sk) {
  if (sk.id === 14) return 1;
  return sk.cost || 0;
}

function canAfford(p, sk, n) {
  if (sk.cost > 0 && p.pt < sk.cost * n) return false;
  if (sk.ticket && p.tk < sk.ticket * n) return false;
  return true;
}

function defValid(defSk, atkSk) {
  if (atkSk.unblockable) return false;
  if (!["NORM","DRAIN","COUNTER"].includes(defSk.type)) return false;
  if (defSk.type === "COUNTER") return false;
  if (defSk.def_ids && defSk.def_ids.includes(atkSk.id)) return true;
  if (defSk.def_lo === undefined) return false;
  const sc = singleCost(atkSk);
  if (sc < defSk.def_lo) return false;
  if (defSk.def_hi !== undefined && sc > defSk.def_hi) return false;
  if (atkSk.id === 14 && !defSk.def_ticket) return false;
  return true;
}

function computeDrain(defSk, atkSk, n) {
  if (defSk.type !== "DRAIN") return [0, 0];
  const sc = singleCost(atkSk);
  let ratio = 0;
  for (const [lo, hi, r] of (defSk.drain || [])) {
    if (sc >= lo && sc <= hi) { ratio = r; break; }
  }
  if (atkSk.id === 14) return [0, n * ratio];
  return [sc * n * ratio, 0];
}

function resolveAtkVsAtk(sk0, n0, sk1, n1) {
  const c0 = singleCost(sk0), c1 = singleCost(sk1);
  const pairs = Math.min(n0, n1);
  let d0 = 0, d1 = 0;
  for (let i = 0; i < pairs; i++) {
    if (c0 > c1) d1 += (c0 - c1) * 0.5;
    else if (c1 > c0) d0 += (c1 - c0) * 0.5;
  }
  if (n0 > pairs) d1 += sk0.dmg * (n0 - pairs);
  if (n1 > pairs) d0 += sk1.dmg * (n1 - pairs);
  return [d0, d1];
}

function resolveAtkVsDef(atkSk, n, defSk) {
  if (defValid(defSk, atkSk)) {
    if (defSk.rebound) {
      return [0, atkSk.dmg * n, 0, 0];
    }
    const [pts, tix] = computeDrain(defSk, atkSk, n);
    return [0, 0, pts, tix];
  }
  return [atkSk.dmg * n, 0, 0, 0];
}

function applyMove(p, sk, n) {
  if (sk.cost > 0) p.pt -= sk.cost * n;
  else if (sk.cost < 0) p.pt += (-sk.cost) * n;
  if (sk.ticket) p.tk -= sk.ticket * n;
}

// ==================== 回合结算 ====================
function runOneRound(a0, a1) {
  const p0 = state.players[0];
  const p1 = state.players[1];
  const sk0 = SKILLS[a0.sid];
  const sk1 = SKILLS[a1.sid];
  const n0 = a0.n, n1 = a1.n;

  applyMove(p0, sk0, n0);
  applyMove(p1, sk1, n1);

  let dmg0 = 0, dmg1 = 0;
  let pts0 = 0, tix0 = 0, pts1 = 0, tix1 = 0;

  // 拉/大拉惩罚
  if (sk0.pull && sk1.type === "DRAIN") {
    const isBig = sk0.big;
    if (sk1.id === 15) dmg1 += isBig ? 2 : 1;
    else if (sk1.id === 16) dmg1 += isBig ? 4 : 2;
  }
  if (sk1.pull && sk0.type === "DRAIN") {
    const isBig = sk1.big;
    if (sk0.id === 15) dmg0 += isBig ? 2 : 1;
    else if (sk0.id === 16) dmg0 += isBig ? 4 : 2;
  }

  // 攻击结算
  if (sk0.type === "ATK" && sk1.type === "ATK") {
    const [d0, d1] = resolveAtkVsAtk(sk0, n0, sk1, n1);
    dmg0 += d0; dmg1 += d1;
  } else if (sk0.type === "ATK" && ["NORM","DRAIN","COUNTER"].includes(sk1.type)) {
    const [dd, ad, pts, tix] = resolveAtkVsDef(sk0, n0, sk1);
    dmg1 += dd; dmg0 += ad;
    pts1 += pts; tix1 += tix;
  } else if (sk1.type === "ATK" && ["NORM","DRAIN","COUNTER"].includes(sk0.type)) {
    const [dd, ad, pts, tix] = resolveAtkVsDef(sk1, n1, sk0);
    dmg0 += dd; dmg1 += ad;
    pts0 += pts; tix0 += tix;
  } else if (sk0.type === "ATK" && sk1.type === "OP") {
    dmg1 += sk0.dmg * n0;
  } else if (sk1.type === "ATK" && sk0.type === "OP") {
    dmg0 += sk1.dmg * n1;
  }

  // 摩擦/大摩自扣血
  if (sk0.friction && sk1.type !== "ATK") {
    dmg0 += sk0.big ? 2.5 : 1.5;
  }
  if (sk1.friction && sk0.type !== "ATK") {
    dmg1 += sk1.big ? 2.5 : 1.5;
  }

  p0.hp -= dmg0;
  p1.hp -= dmg1;

  p0.pt += pts0;
  p0.tk += tix0;
  p1.pt += pts1;
  p1.tk += tix1;

  p0.pt = Math.max(0, Math.min(PT_MAX, p0.pt));
  p0.tk = Math.max(0, Math.min(TK_MAX, p0.tk));
  p1.pt = Math.max(0, Math.min(PT_MAX, p1.pt));
  p1.tk = Math.max(0, Math.min(TK_MAX, p1.tk));

  if (p0.hp <= 0) p0.dead = true;
  if (p1.hp <= 0) p1.dead = true;
}

// ==================== 查表 ====================
function makeStateKey(p, opp) {
  const h = Math.max(HP_MIN, Math.min(HP_MAX, Math.floor(p.hp * 2)));
  const hOpp = Math.max(HP_MIN, Math.min(HP_MAX, Math.floor(opp.hp * 2)));
  const pt = Math.max(0, Math.min(PT_MAX, Math.floor(p.pt)));
  const ptOpp = Math.max(0, Math.min(PT_MAX, Math.floor(opp.pt)));
  const tk = Math.max(0, Math.min(TK_MAX, Math.floor(p.tk)));
  const tkOpp = Math.max(0, Math.min(TK_MAX, Math.floor(opp.tk)));
  return [h, pt, tk, hOpp, ptOpp, tkOpp].join(",");
}

function queryPI(p, opp) {
  const key = makeStateKey(p, opp);
  return PI_TABLE[key] || [[9, 1, 1.0]];
}

function queryV(p, opp) {
  const key = makeStateKey(p, opp);
  return V_TABLE[key] !== undefined ? V_TABLE[key] : 0;
}

function sampleDist(dist) {
  const total = dist.reduce((s, x) => s + x[2], 0);
  let r = Math.random() * total;
  for (const [sid, n, p] of dist) {
    r -= p;
    if (r <= 0) return { sid, n };
  }
  return { sid: dist[0][0], n: dist[0][1] };
}

// ==================== 渲染 ====================
function render() {
  const p0 = state.players[0], p1 = state.players[1];
  document.getElementById("hp0").textContent = p0.hp.toFixed(1);
  document.getElementById("pt0").textContent = p0.pt;
  document.getElementById("tk0").textContent = p0.tk;
  document.getElementById("hp1").textContent = p1.hp.toFixed(1);
  document.getElementById("pt1").textContent = p1.pt;
  document.getElementById("tk1").textContent = p1.tk;

  document.getElementById("card-p0").classList.toggle("dead", p0.dead);
  document.getElementById("card-p1").classList.toggle("dead", p1.dead);

  renderSkillButtons();
  renderView();
}

function renderSkillButtons() {
  const grid = document.getElementById("skill-grid");
  grid.innerHTML = "";
  const p0 = state.players[0];

  const sids = [1,2,3,4,5,6,7,8,12,14,9,10,11,13,21,22,23,15,16,19,20,17,18,24];

  for (const sid of sids) {
    const sk = SKILLS[sid];
    const btn = document.createElement("button");
    btn.className = "skill-btn " + sk.type.toLowerCase();
    btn.innerHTML = `
      <span class="sid">${sid}</span>
      <span class="sk-name">${sk.name}</span>
      <span class="sk-desc">${skillShortDesc(sk)}</span>
    `;

    let usable = canAfford(p0, sk, 1);

    if (gameOver || p0.dead || !usable) {
      btn.disabled = true;
    } else {
      btn.onclick = () => selectSkill(sk);
    }
    grid.appendChild(btn);
  }
}

function skillShortDesc(sk) {
  if (sk.type === "ATK") {
    if (sk.id === 14) return "免单×n 0.5×n";
    if (sk.id === 24) return "20费 10伤";
    return `${sk.cost}费 ${sk.dmg}伤` + (sk.multi ? " 多重" : "");
  }
  if (sk.type === "OP") return "+1点";
  if (sk.type === "NORM") {
    if (sk.def_ids) return "防" + sk.def_ids.map(i=>SKILLS[i].name).join("/");
    return `防${sk.def_lo}-${sk.def_hi}费`;
  }
  if (sk.type === "DRAIN") {
    return `吸${sk.def_lo}-${sk.def_hi}费`;
  }
  if (sk.type === "COUNTER") return "反制";
  return "";
}

function selectSkill(sk) {
  if (sk.type !== "ATK") {
    playRound({ sid: sk.id, n: 1 });
    return;
  }
  pendingAttack = sk;
  document.getElementById("input-skill-name").textContent = sk.name + "：";
  const nInput = document.getElementById("input-n");
  nInput.value = 1;
  if (!sk.multi) {
    nInput.disabled = true;
    nInput.value = 1;
  } else {
    nInput.disabled = false;
    const maxN = sk.cost > 0 ? Math.floor(state.players[0].pt / sk.cost) : state.players[0].tk;
    nInput.max = Math.max(1, maxN);
  }
  document.getElementById("input-area").classList.add("active");
}

function confirmAttack() {
  if (!pendingAttack) return;
  const n = parseInt(document.getElementById("input-n").value) || 1;
  playRound({ sid: pendingAttack.id, n });
}

function cancelAttack() {
  pendingAttack = null;
  document.getElementById("input-area").classList.remove("active");
}

// ==================== 主流程 ====================
function playRound(playerAction) {
  if (gameOver) return;

  const p0 = state.players[0];
  const p1 = state.players[1];

  const sk0 = SKILLS[playerAction.sid];
  if (!canAfford(p0, sk0, playerAction.n)) {
    appendLog("⚠ 资源不足");
    return;
  }

  const distAI = queryPI(p1, p0);
  const aiAction = sampleDist(distAI);

  state.round++;
  const hp0Before = p0.hp;
  const hp1Before = p1.hp;

  runOneRound(playerAction, aiAction);

  appendLog(`<span class="round-line">── 第 ${state.round} 轮 ──</span>`);
  appendLog(`<span class="result-line">P0: ${actionLabel(playerAction)}</span>`);
  appendLog(`<span class="result-line">P1: ${actionLabel(aiAction)}</span>`);

  const d0 = formatNum(hp0Before - p0.hp);
  const d1 = formatNum(hp1Before - p1.hp);
  if (p0.hp < hp0Before || p1.hp < hp1Before) {
    if (p0.hp < hp0Before) appendLog(`<span class="result-line hp-change">P0 HP-${d0}</span>`);
    if (p1.hp < hp1Before) appendLog(`<span class="result-line hp-change">P1 HP-${d1}</span>`);
  } else {
    appendLog(`<span class="result-line" style="color:#6a7580">(无人受伤)</span>`);
  }

  pendingAttack = null;
  document.getElementById("input-area").classList.remove("active");

  if (p0.dead || p1.dead) {
    gameOver = true;
    let msg = "", cls = "";
    if (p0.dead && p1.dead) { msg = "平局"; cls = "draw"; }
    else if (p0.dead) { msg = "P1 胜"; cls = "lose"; }
    else { msg = "P0 胜"; cls = "win"; }
    appendLog(`<span class="round-line">结果：${msg}</span>`);

    // ★ 用 hidden class 而不是 style.display
    document.getElementById("game-over-box").innerHTML =
      `<div class="game-over ${cls}">${msg}</div>`;
    document.getElementById("game-over-box").classList.remove("hidden");
    document.getElementById("skill-grid").classList.add("hidden");
    document.getElementById("input-area").classList.add("hidden");
  }

  render();
}

function formatNum(x) {
  return parseFloat(x.toFixed(2)).toString();
}

function actionLabel(a) {
  const sk = SKILLS[a.sid];
  return a.n > 1 ? `${sk.name}×${a.n}` : sk.name;
}

function appendLog(html) {
  const logEl = document.getElementById("log");
  const line = document.createElement("div");
  line.innerHTML = html;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// ==================== 视角显示 ====================
function setView(v) {
  currentView = v;
  document.getElementById("view-p0").classList.toggle("active", v === 0);
  document.getElementById("view-p1").classList.toggle("active", v === 1);
  document.getElementById("view-none").classList.toggle("active", v === -1);
  renderView();
}

function renderView() {
  const content = document.getElementById("view-content");
  const empty = document.getElementById("view-empty");

  if (currentView === -1) {
    content.classList.add("hidden");
    empty.classList.remove("hidden");
    return;
  }
  content.classList.remove("hidden");
  empty.classList.add("hidden");

  const p0 = state.players[0];
  const p1 = state.players[1];

  let me, opp;
  if (currentView === 0) {
    me = p0; opp = p1;
  } else {
    me = p1; opp = p0;
  }

  const v = queryV(me, opp);
  const winRate = (1 + v) / 2;
  const rateEl = document.getElementById("win-rate-val");
  rateEl.textContent = (winRate * 100).toFixed(1) + "%";
  rateEl.style.color = winRate > 0.6 ? "#7fb069"
                      : winRate < 0.4 ? "#d97757"
                      : "#f0c674";

  const dist = queryPI(me, opp);
  const distEl = document.getElementById("dist-list");
  distEl.innerHTML = "";

  const sorted = [...dist].sort((a, b) => b[2] - a[2]);
  for (const [sid, n, p] of sorted) {
    if (p < 0.001) continue;
    const sk = SKILLS[sid];
    const label = n > 1 ? `${sk.name}×${n}` : sk.name;
    const pct = (p * 100).toFixed(2);
    const barW = (p * 100).toFixed(1);

    const row = document.createElement("div");
    row.className = "dist-row";
    row.innerHTML = `
      <div class="dist-name">${label}</div>
      <div class="dist-prob">${pct}%</div>
      <div class="dist-bar-bg"><div class="dist-bar" style="width:${barW}%"></div></div>
    `;
    distEl.appendChild(row);
  }

  if (sorted.length === 0) {
    distEl.innerHTML = `<div style="color:#6a7580;font-size:13px">(无可用招式)</div>`;
  }
}

// ==================== 初始化 / 重置 ====================
function resetGame() {
  state = {
    players: [makePlayer(), makePlayer()],
    round: 0,
  };
  gameOver = false;
  pendingAttack = null;

  document.getElementById("log").innerHTML = "";

  // ★ 全部用 class 控制显隐，避免 style.display 残留
  document.getElementById("input-area").classList.remove("active");
  document.getElementById("input-area").classList.remove("hidden");
  document.getElementById("game-over-box").classList.add("hidden");
  document.getElementById("game-over-box").innerHTML = "";
  document.getElementById("skill-grid").classList.remove("hidden");

  render();
  appendLog("=== 游戏开始 ===");
}

// ==================== 加载策略表 ====================
function showLoading(msg) {
  const el = document.getElementById("loading-steps");
  el.innerHTML += `<div class="step">${msg}</div>`;
}

function showError(title, detail) {
  document.getElementById("loading").classList.add("hidden");
  const box = document.getElementById("error-box");
  box.innerHTML = `
    <h2>❌ ${title}</h2>
    ${detail}
  `;
  box.classList.remove("hidden");
}

async function loadJSON(name) {
  const url = new URL(name, location.href).href;
  showLoading(`加载 ${name} …`);
  const res = await fetch(name);
  if (!res.ok) {
    throw {
      stage: "fetch",
      name: name,
      status: res.status,
      url: url,
    };
  }
  showLoading(`解析 ${name} …`);
  try {
    return await res.json();
  } catch (e) {
    throw {
      stage: "parse",
      name: name,
      url: url,
      message: e.message,
    };
  }
}

async function init() {
  try {
    V_TABLE = await loadJSON("jie_V.json");
    PI_TABLE = await loadJSON("jie_pi.json");

    document.getElementById("loading").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    resetGame();
  } catch (e) {
    console.error("加载失败：", e);

    if (e.stage === "fetch") {
      showError(
        `无法加载 ${e.name}`,
        `<p>HTTP 状态码：<code>${e.status}</code></p>
         <p>尝试加载的 URL：<br><code>${e.url}</code></p>
         <p>排查步骤：</p>
         <ul>
           <li>直接在浏览器打开上面的 URL，看是否 404</li>
           <li>确认 <code>${e.name}</code> 已经上传到仓库</li>
           <li>确认 <code>${e.name}</code> 和 <code>index.html</code> 在同一目录</li>
           <li>确认文件名大小写完全一致（Linux 服务器区分大小写）</li>
           <li>如果刚 push，等 1~2 分钟让 GitHub Pages 构建完成</li>
           <li>打开 DevTools → Network 面板，勾选 Disable cache 再刷新</li>
         </ul>`
      );
    } else if (e.stage === "parse") {
      showError(
        `无法解析 ${e.name}`,
        `<p>文件已下载，但不是有效的 JSON。</p>
         <p>URL：<code>${e.url}</code></p>
         <p>错误信息：<code>${e.message}</code></p>
         <p>可能原因：</p>
         <ul>
           <li>文件被意外截断或损坏</li>
           <li>该 URL 返回的是 HTML（比如 404 页面），不是 JSON</li>
           <li>尝试重新运行 <code>export_for_web.py</code> 生成 JSON</li>
         </ul>`
      );
    } else {
      showError(
        "未知错误",
        `<p>${e.message || JSON.stringify(e)}</p>`
      );
    }
  }
}

init();
</script>
